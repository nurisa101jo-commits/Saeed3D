name: Build Saeed for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify VRM
        run: npm run verify-assets

      - name: Typecheck application
        run: npm run typecheck

      - name: Build Windows installer and ZIP
        run: npm run package

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-Installer
          path: release/Saeed-*-x64.exe
          if-no-files-found: error

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-ZIP
          path: release/Saeed-*-x64.zip
          if-no-files-found: error


  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify VRM
        run: npm run verify-assets
      - name: Build and publish GitHub release
        run: npm run package:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
