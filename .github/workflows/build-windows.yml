name: Build Saeed for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify runner and repository
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Commit: $env:GITHUB_SHA"
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $source = "public/icons/Saeed.png"
          $icon = "public/icons/saeed.ico"
          if (!(Test-Path $source)) { throw "Source Saeed PNG is missing: $source" }

          if (!(Get-Command magick -ErrorAction SilentlyContinue) ) {
            choco install imagemagick --yes --no-progress
          }

          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick failed to generate $icon" }
          if (!(Test-Path $icon)) { throw "Saeed.ico was not generated from Saeed.png." }

          $bytes = (Get-Item $icon).Length
          if ($bytes -lt 1000) { throw "Windows icon is unexpectedly small: $bytes bytes" }

          $identify = & magick identify $icon 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected: $identify" }
          Write-Host "Native Windows icon generated from Saeed.png:"
          Write-Host $identify

      - name: Download offline English speech models
        shell: pwsh
        run: |
          $sttDir = "public/models/offline-stt"
          $sttArchive = "$env:RUNNER_TEMP/sherpa-onnx-whisper-tiny.tar.bz2"
          New-Item -ItemType Directory -Force -Path $sttDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2" -OutFile $sttArchive
          tar -xjf $sttArchive -C $sttDir
          $sttModel = Join-Path $sttDir "sherpa-onnx-whisper-tiny"
          if (!(Test-Path "$sttModel/tiny-encoder.int8.onnx")) { throw "Offline Whisper encoder was not downloaded" }
          if (!(Test-Path "$sttModel/tiny-decoder.int8.onnx")) { throw "Offline Whisper decoder was not downloaded" }
          if (!(Test-Path "$sttModel/tiny-tokens.txt")) { throw "Offline Whisper tokens were not downloaded" }
          Get-ChildItem -Path $sttModel -File | Where-Object { $_.Name -notin @("tiny-encoder.int8.onnx","tiny-decoder.int8.onnx","tiny-tokens.txt") } | Remove-Item -Force
          Get-ChildItem -Path $sttModel -Directory | Remove-Item -Recurse -Force

          $ttsDir = "public/models/offline-tts"
          $ttsArchive = "$env:RUNNER_TEMP/vits-piper-en_US-lessac-medium.tar.bz2"
          New-Item -ItemType Directory -Force -Path $ttsDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2" -OutFile $ttsArchive
          tar -xjf $ttsArchive -C $ttsDir
          $ttsModel = Join-Path $ttsDir "vits-piper-en_US-lessac-medium"
          if (!(Test-Path "$ttsModel/en_US-lessac-medium.onnx")) { throw "Offline TTS model was not downloaded" }
          if (!(Test-Path "$ttsModel/tokens.txt")) { throw "Offline TTS tokens were not downloaded" }
          if (!(Test-Path "$ttsModel/espeak-ng-data")) { throw "Offline TTS espeak-ng-data was not downloaded" }
          Get-ChildItem -Path $ttsModel -File | Where-Object { $_.Name -ne "en_US-lessac-medium.onnx" -and $_.Name -ne "tokens.txt" } | Remove-Item -Force
          Get-ChildItem -Path $ttsModel -Directory | Where-Object { $_.Name -ne "espeak-ng-data" } | Remove-Item -Recurse -Force

      - name: Verify VRM
        run: npm run verify-assets

      - name: Typecheck application
        run: npm run typecheck

      - name: Rebuild native offline STT/TTS module for Electron
        run: npm run rebuild

      - name: Remove stale draft release for this version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $drafts = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName,name,isDraft | ConvertFrom-Json
          foreach ($release in $drafts) {
            if ($release.isDraft -and (($release.tagName -eq "v$version") -or ($release.name -match [regex]::Escape($version)))) {
              Write-Host "Deleting stale draft release: tag=$($release.tagName), name=$($release.name)"
              gh release delete $release.tagName --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale draft release $($release.tagName)" }
            }
          }

      - name: Build Windows installer and ZIP and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:release

      - name: Verify release is published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url | ConvertFrom-Json

          if ($release.isDraft) {
            Write-Host "Release is still draft; promoting it now."
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
            $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url | ConvertFrom-Json
          }

          if ($release.isDraft) { throw "Release $tag is still a draft after promotion." }
          if ($release.isPrerelease) { throw "Release $tag is unexpectedly marked as prerelease." }

          Write-Host "Published release: $($release.url)"

      - name: Verify packaged offline TTS model
        shell: pwsh
        run: |
          $model = "release/win-unpacked/resources/models/offline-tts/vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx"
          $tokens = "release/win-unpacked/resources/models/offline-tts/vits-piper-en_US-lessac-medium/tokens.txt"
          $data = "release/win-unpacked/resources/models/offline-tts/vits-piper-en_US-lessac-medium/espeak-ng-data"
          if (!(Test-Path $model)) { throw "Packaged offline TTS model is missing: $model" }
          if (!(Test-Path $tokens)) { throw "Packaged offline TTS tokens are missing: $tokens" }
          if (!(Test-Path $data)) { throw "Packaged offline TTS data directory is missing: $data" }
          Write-Host "Offline TTS package verified"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-Installer
          path: release/Saeed-*-x64.exe
          if-no-files-found: error

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-ZIP
          path: release/Saeed-*-x64.zip
          if-no-files-found: error
