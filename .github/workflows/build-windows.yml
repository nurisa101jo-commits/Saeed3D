name: Build Saeed for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify VRM
        run: npm run verify-assets

      - name: Build Windows installer and ZIP
        run: npm run package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows
          path: release/*
          if-no-files-found: error
